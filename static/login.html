<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/login.css" />
    <title>My Wonderful Website</title>
</head>
<body>
    <div class="login-box">
        <h2>login page</h2>

        <div class="input-group">
            <label for="username">username</label>
            <input type="text" id="username" placeholder="input username">
        </div>
        <div class="input-group">
            <label for="password">password</label>
            <input type="password" id="password" placeholder="input password">
        </div>
        <button class="btn" onclick="login()">login</button>
        <div class="error" id="error">error number!</div>
    </div>
  <script type="module" src="/static/login.js"></script>
</body>
</html>
