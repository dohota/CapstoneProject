<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>战棋</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* 禁止浏览器默认滚动 */
            background-color: #2c3e50;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }
        /* 游戏容器填满屏幕 */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            background-color: #222; /* 深色背景代表虚空 */
        }
        /* UI 层悬浮在 Canvas 之上 */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none; /* 让鼠标穿透UI，点击到底下的地图 */
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .status-box {
            background: rgba(44, 62, 80, 0.9);
            padding: 15px 30px;
            border-radius: 30px;
            border: 2px solid rgba(255,255,255,0.1);
            display: inline-block;
        }
        h1 { margin: 0; font-size: 1.5rem; }
        p { margin: 5px 0 0 0; opacity: 0.8; font-size: 0.9rem; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">
        <div class="status-box">
            <h1 id="turn-text">红方回合</h1>
            <p>左键拖拽地图    点击选中单位/移动</p>
            <p id="debug-info">Camera: 0, 0</p>
        </div>
    </div>
</div>
<script type="module" src="/static/chess/manage.js">
</script>
</body>
</html>
