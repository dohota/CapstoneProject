<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>WAR</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas {
            background-color: #ecf0f1;
            border-radius: 4px;
            cursor: pointer;
        }
        #ui-layer {
            margin-top: 15px;
            text-align: center;
        }
        .status {
            font-size: 1.2em;
            font-weight: bold;
            padding: 10px 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
        }
        .player-1 { color: #e74c3c; } /* 红色 */
        .player-2 { color: #3498db; } /* 蓝色 */
    </style>
</head>
<body>
    <h1>战棋</h1>

    <div id="game-container">
        <canvas id="hexCanvas" width="800" height="600"></canvas>
    </div>

    <div id="ui-layer">
        <div id="statusText" class="status player-1">当前回合: 玩家 1 (红方)</div>
        <p style="font-size: 0.9em; opacity: 0.8;">操作：点击单位选中，点击绿色高亮区域移动。</p>
    </div>

<script src="/static/war.js">

</script>
</body>
</html>
