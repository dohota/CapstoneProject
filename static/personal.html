<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>My Introduction</title>
    <style>
        body {
            /*font-family: Arial;*/
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ccc;
            text-align: center;
            padding: 8px;
        }
        th {
            background: #f2f2f2;
        }
        input {
            padding: 6px;
            margin-right: 5px;
        }
        button {
            padding: 6px 10px;
            margin-left: 3px;
        }
    </style>
</head>
<body>
<!-- 输入区 -->
<input type="text" id="name" placeholder="姓名">
<input type="text" id="age" placeholder="年龄">
<button onclick="addRow()">添加</button>
<br><br>

<!-- 搜索框 -->
<input type="text" id="search" placeholder="搜索姓名..." oninput="searchTable()">

<!-- 表格 -->
<table id="dataTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>姓名</th>
            <th>年龄</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
//let idCounter = 1;
async function loadData() {
    const res = await fetch("http://127.0.0.1:8000/persons");
    const data = await res.json();

    const tbody = document.querySelector("#dataTable tbody");
    tbody.innerHTML = ""; // 清空表格

    data.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${item.id}</td>
            <td>${item.name}</td>
            <td>${item.age}</td>
            <td>
                <button onclick="editRow(this)">编辑</button>
                <button onclick="deleteRow(${item.id})">删除</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

async function addRow() {
    const name = document.getElementById("name").value.trim();
    const age = document.getElementById("age").value.trim();

    const res = await fetch("http://127.0.0.1:8000/persons", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, age })
    });
    loadData(); // 重新加载表格
}

async function deleteRow(id) {
    await fetch(`http://127.0.0.1:8000/persons/${id}`, {
        method: "DELETE"
    });
    loadData();
}

function editRow(btn) {
    const row = btn.parentNode.parentNode;
    const cells = row.children;

    const name = cells[1].innerText;
    const age = cells[2].innerText;

    // 替换成输入框
    cells[1].innerHTML = `<input value="${name}">`;
    cells[2].innerHTML = `<input value="${age}">`;

    btn.innerText = "保存";
    btn.onclick = function () { saveRow(this) };
}

async function saveRow(btn) {
    const row = btn.parentNode.parentNode;
    const id = row.children[0].innerText;
    const name = row.children[1].querySelector("input").value;
    const age = row.children[2].querySelector("input").value;

    await fetch(`http://127.0.0.1:8000/persons/${id}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ name, age })
    });

    loadData();
}

function searchTable() {
    const keyword = document.getElementById("search").value.toLowerCase();
    const rows = document.querySelectorAll("#dataTable tbody tr");

    rows.forEach(row => {
        const name = row.children[1].innerText.toLowerCase();
        row.style.display = name.includes(keyword) ? "" : "none";
    });
}
</script>

</body>
</html>
