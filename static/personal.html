<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>My Introduction</title>
    <style>
        body {
            /*font-family: Arial;*/
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ccc;
            text-align: center;
            padding: 8px;
        }
        th {
            background: #f2f2f2;
        }
        input {
            padding: 6px;
            margin-right: 5px;
        }
        button {
            padding: 6px 10px;
            margin-left: 3px;
        }
    </style>
</head>
<body>

<h2>纯前端 JS 增删改查表格</h2>

<!-- 输入区 -->
<input type="text" id="name" placeholder="姓名">
<input type="text" id="age" placeholder="年龄">
<button onclick="addRow()">添加</button>
<br><br>

<!-- 搜索框 -->
<input type="text" id="search" placeholder="搜索姓名..." oninput="searchTable()">

<!-- 表格 -->
<table id="dataTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>姓名</th>
            <th>年龄</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
let idCounter = 1;

// 添加
function addRow() {
    const name = document.getElementById("name").value.trim();
    const age = document.getElementById("age").value.trim();
    if (!name || !age) {
        alert("请输入姓名和年龄！");
        return;
    }

    const table = document.getElementById("dataTable").querySelector("tbody");

    const row = document.createElement("tr");

    row.innerHTML = `
        <td>${idCounter++}</td>
        <td>${name}</td>
        <td>${age}</td>
        <td>
            <button onclick="editRow(this)">编辑</button>
            <button onclick="deleteRow(this)">删除</button>
        </td>
    `;

    table.appendChild(row);

    document.getElementById("name").value = "";
    document.getElementById("age").value = "";
}

// 删除
function deleteRow(btn) {
    const row = btn.parentNode.parentNode;
    row.remove();
}

// 编辑
function editRow(btn) {
    const row = btn.parentNode.parentNode;
    const cells = row.children;

    const name = cells[1].innerText;
    const age = cells[2].innerText;

    // 替换成输入框
    cells[1].innerHTML = `<input value="${name}">`;
    cells[2].innerHTML = `<input value="${age}">`;

    btn.innerText = "保存";
    btn.onclick = function () { saveRow(this) };
}

// 保存编辑内容
function saveRow(btn) {
    const row = btn.parentNode.parentNode;
    const cells = row.children;

    const name = cells[1].querySelector("input").value;
    const age = cells[2].querySelector("input").value;

    cells[1].innerText = name;
    cells[2].innerText = age;

    btn.innerText = "编辑";
    btn.onclick = function () { editRow(this) };
}

// 搜索
function searchTable() {
    const keyword = document.getElementById("search").value.toLowerCase();
    const rows = document.querySelectorAll("#dataTable tbody tr");

    rows.forEach(row => {
        const name = row.children[1].innerText.toLowerCase();
        row.style.display = name.includes(keyword) ? "" : "none";
    });
}
</script>

</body>
</html>
